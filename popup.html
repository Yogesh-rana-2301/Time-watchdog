<!doctype html>
<html>
  <head>
    <title>Stopwatch & Countdown</title>
    <link rel="stylesheet" type="text/css" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <div class="nav">
        <button id="show-timer" class="nav-btn active">Timer</button>
        <button id="show-countdown" class="nav-btn">Countdown</button>
      </div>

      <div class="timer-display">00:00:00</div>

      <div id="timer-controls">
        <div class="button-group">
          <button id="start-stopwatch">Start</button>
          <button id="stop-stopwatch">Stop</button>
          <button id="reset-stopwatch">Reset</button>
        </div>
      </div>

      <div id="countdown-controls" class="hidden">
        <div class="button-group">
          <button class="countdown-btn" data-time="300">5 min</button>
          <button class="countdown-btn" data-time="1200">20 min</button>
          <button class="countdown-btn" data-time="2400">40 min</button>
        </div>
        <div class="button-group">
          <button id="resume-countdown">Resume</button>
          <button id="stop-countdown">Stop</button>
          <button id="reset-countdown">Reset</button>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
